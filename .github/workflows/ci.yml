name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Backend Rust ─────────────────────────────────────────────────────────────
  rust:
    name: Rust (check + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # La clé inclut les features pour éviter de réutiliser des artefacts
          # compilés avec custom-protocol (qui déclenche le check frontendDist)
          key: ${{ runner.os }}-cargo-no-default-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-no-default-

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # Sans custom-protocol, tauri-codegen passe en mode dev (dev=true) et
      # court-circuite le check de frontendDist dès que devUrl est défini.
      # Aucun stub frontend/build nécessaire.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-default-features -- -D warnings

      - name: Check
        working-directory: src-tauri
        run: cargo check --no-default-features

      - name: Tests
        working-directory: src-tauri
        run: cargo test --no-default-features

  # ── Pack MCP : signature + empreinte épinglée (F-02) ─────────────────────────
  # Détecte dès la PR une release du pack non signée, une signature invalide, un
  # MCP_PACK_VERSION qui ne correspond plus à MCP_PACK_SHA256, ou un tag déplacé :
  # sans cela, l'échec n'apparaîtrait qu'au moment de publier une version.
  mcp-pack:
    name: Pack MCP (signature + empreinte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Installer minisign
        uses: ./.github/actions/install-minisign

      - name: Vérifier le pack MCP
        run: bash scripts/fetch-mcp-pack.sh --force
