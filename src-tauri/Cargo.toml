[package]
name = "demeter"
version = "2.4.0"
description = "Demeter – Assistant RH"
authors = ["Pierre Couget <ktulu.analog@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "demeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "demeter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5.1"

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
#tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls", "charset", "http2"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
#thiserror = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
#once_cell = "1"
dotenvy = "0.15"
bytes = "1"
futures = "0.3"
#tokio-stream = "0.1"
#regex = "1"

# JWT pour Qdrant granular access keys
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

pdf-extract = "0.10"
zip = "8.6.0"
sha2 = "0.10"

# Archives / décompression (zip sert déjà aux DOCX et au mcp-pack)
sevenz-rust2 = "0.22"
# Mémoire disponible → plafonds adaptatifs des uploads volumineux
sysinfo = "0.33"
tempfile = "3"

# OCR natif Windows (Windows.Data.Pdf + Windows.Media.Ocr) — uniquement sur Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Data_Pdf",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
] }
quick-xml = { version = "0.36", features = ["serialize"] }
encoding_rs = "0.8"
urlencoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1 
panic = "abort"  
